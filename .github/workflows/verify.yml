name: MAGI verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: Verification scope (pull requests always run the full suite)
        type: choice
        default: all
        options: [all, dashboard]

permissions:
  contents: read

concurrency:
  group: magi-check-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'dashboard' && 'dashboard' || 'full' }}
  cancel-in-progress: true

jobs:
  contracts:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'dashboard' && 'dashboard' || 'contracts' }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Archive exact committed source (no git credentials or runtime files)
        if: runner.os == 'Linux'
        run: git archive --format=zip --output=source-snapshot.zip HEAD
      - name: Repository tests and release checks (no vendor invocation)
        if: github.event_name != 'workflow_dispatch' || inputs.scope != 'dashboard'
        run: npm run check
      - name: Dashboard and installer tests (no vendor invocation)
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'dashboard'
        run: node --test tools/magi-dashboard.test.js tools/install-plugin.test.js
      - name: Dashboard release check
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'dashboard'
        run: node tools/release-check.js
      - name: Preserve private source snapshot for reproducible verification
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.sha }}
          path: source-snapshot.zip
          if-no-files-found: error
          retention-days: 3
