<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="t d">
<title id="t">MAGI enforcement architecture</title><desc id="d">Flow from arbiter classification through deterministic policy, seat execution, proof and tally.</desc>
<defs><style>.b{fill:#0c111c;stroke:#34435e;stroke-width:2}.t{font:700 22px system-ui,sans-serif;fill:#f6f8fc}.s{font:500 15px system-ui,sans-serif;fill:#aab6c9}.a{stroke:#ff476d;stroke-width:4;fill:none;marker-end:url(#m)}.g{fill:#10283c;stroke:#2f9cff;stroke-width:2}.o{fill:#2e2511;stroke:#f5b93d;stroke-width:2}.gr{fill:#10291d;stroke:#36d88f;stroke-width:2}.x{fill:#29121b;stroke:#ff476d;stroke-width:2}.mono{font:600 14px ui-monospace,monospace;fill:#d7deea}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ff476d"/></marker></defs>
<rect width="1400" height="760" fill="#05070b"/>
<text x="70" y="62" class="t" font-size="34">MAGI / code-enforced dispatch</text><text x="70" y="92" class="s">The model proposes. Deterministic policy decides what is legal.</text>
<g transform="translate(70 145)"><rect width="210" height="105" rx="16" class="x"/><text x="105" y="42" text-anchor="middle" class="t">Jev engine</text><text x="105" y="69" text-anchor="middle" class="s">classifies + proposes plan</text><text x="105" y="90" text-anchor="middle" class="s">never implements or votes</text></g>
<path class="a" d="M280 198h100"/>
<g transform="translate(380 130)"><rect width="280" height="135" rx="16" class="b"/><text x="140" y="38" text-anchor="middle" class="t">Dispatch policy</text><text x="140" y="66" text-anchor="middle" class="mono">dispatch-matrix.json</text><text x="140" y="91" text-anchor="middle" class="s">class · vendor · model · effort</text><text x="140" y="115" text-anchor="middle" class="s">distribution · probes · cross-review</text></g>
<path class="a" d="M660 198h90"/>
<g transform="translate(750 130)"><rect width="270" height="135" rx="16" class="b"/><text x="135" y="38" text-anchor="middle" class="t">Seat policy</text><text x="135" y="66" text-anchor="middle" class="mono">seat-profiles.json</text><text x="135" y="91" text-anchor="middle" class="s">role · permissions · skills</text><text x="135" y="115" text-anchor="middle" class="s">leaf-only · required proof</text></g>
<path class="a" d="M1020 198h90"/>
<g transform="translate(1110 130)"><rect width="220" height="135" rx="16" class="b"/><text x="110" y="38" text-anchor="middle" class="t">Rules gate</text><text x="110" y="66" text-anchor="middle" class="mono">R01–R22</text><text x="110" y="91" text-anchor="middle" class="s">hashed + staged</text><text x="110" y="115" text-anchor="middle" class="s">fail closed</text></g>
<path class="a" d="M1220 265v75H700"/>
<g transform="translate(180 365)"><rect width="290" height="150" rx="18" class="g"/><text x="145" y="40" text-anchor="middle" class="t">Melchior / OpenAI</text><text x="145" y="70" text-anchor="middle" class="s">Luna → Terra → Sol → Astra</text><text x="145" y="100" text-anchor="middle" class="s">workspace-write or read-only</text><text x="145" y="126" text-anchor="middle" class="s">session + tokens + model proof</text></g>
<g transform="translate(555 365)"><rect width="290" height="150" rx="18" class="o"/><text x="145" y="40" text-anchor="middle" class="t">Balthasar / Anthropic</text><text x="145" y="70" text-anchor="middle" class="s">Sonnet · Fable · Opus by role</text><text x="145" y="100" text-anchor="middle" class="s">implementation vs judgment</text><text x="145" y="126" text-anchor="middle" class="s">native model + effort + usage</text></g>
<g transform="translate(930 365)"><rect width="290" height="150" rx="18" class="gr"/><text x="145" y="40" text-anchor="middle" class="t">Casper / Google</text><text x="145" y="70" text-anchor="middle" class="s">Flash → Pro</text><text x="145" y="100" text-anchor="middle" class="s">exact observed slug required</text><text x="145" y="126" text-anchor="middle" class="s">conversation + usage + model proof</text></g>
<path class="a" d="M325 515v85h375"/><path class="a" d="M700 515v85"/><path class="a" d="M1075 515v85H700"/>
<g transform="translate(495 600)"><rect width="410" height="105" rx="16" class="x"/><text x="205" y="37" text-anchor="middle" class="t">Proof → telemetry → tally → approval</text><text x="205" y="67" text-anchor="middle" class="s">receipts are structured evidence, not claims</text><text x="205" y="89" text-anchor="middle" class="s">deterministic failure cannot be waived</text></g>
</svg>
