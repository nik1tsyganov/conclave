<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="ttl dsc">
<title id="ttl">CONCLAVE enforcement architecture</title>
<desc id="dsc">The arbiter proposes. Deterministic policy constrains every proposal. Three seats execute under that policy, each a leaf. Evidence, not assertion, decides the outcome, and the unit's own check gates the landing without joining the count.</desc>
<!-- Named by ROLE and by RULE, never by vendor or model. The previous version of this diagram
     named four models that were retired within the month; the catalog lives in
     .cursor/skills/conclave-cli/references/dispatch-matrix.json and nowhere else. -->
<defs>
  <style>
    :root { --bg:#f5f0e8; --ink:#3a332c; --muted:#7a7066; --rub:#8f3d24; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#16120e; --ink:#ebe5dc; --muted:#9d938a; --rub:#c2664a; }
    }
    svg   { color: var(--ink); }
    .bg   { fill: var(--bg); }
    .box  { fill:none; stroke:var(--ink); stroke-width:1.6; }
    .rub  { stroke:var(--rub); }
    .fill { fill:var(--ink); }
    .wire { fill:none; stroke:var(--ink); stroke-width:1.6; }
    .head { font:400 22px Cinzel,Georgia,serif; fill:var(--ink); letter-spacing:.06em; }
    .band { font:400 11px ui-monospace,SFMono-Regular,Menlo,monospace; fill:var(--rub); letter-spacing:.18em; }
    .t    { font:400 13px ui-monospace,SFMono-Regular,Menlo,monospace; fill:var(--ink); }
    .ts   { font:400 11px ui-monospace,SFMono-Regular,Menlo,monospace; fill:var(--ink); opacity:.82; }
    .tm   { font:400 10px ui-monospace,SFMono-Regular,Menlo,monospace; fill:var(--muted); }
  </style>
  <pattern id="h" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <line x1="0" y1="0" x2="0" y2="4" stroke="currentColor" stroke-width=".7" opacity=".32"/>
  </pattern>
  <pattern id="hx" width="7" height="7" patternUnits="userSpaceOnUse">
    <path d="M0 0h7M0 0v7" stroke="currentColor" stroke-width=".6" opacity=".28"/>
  </pattern>
</defs>

<rect class="bg" x="0" y="0" width="1000" height="640"/>
<text class="head" x="8" y="32">Enforcement architecture</text>
<text class="tm"   x="8" y="52">The model proposes. Deterministic policy decides what is legal. Evidence, not assertion, decides the outcome.</text>

<text class="band" x="8" y="96">ARBITER</text>
<rect class="box" x="8" y="108" width="420" height="62" rx="2" stroke-dasharray="5 4"/>
<text class="t"  x="26" y="132">Proposes, and is counted in nothing</text>
<text class="ts" x="26" y="152">task class &#183; which seats &#183; the tally distributions</text>
<text class="tm" x="444" y="134">Never implements, verifies, reviews or votes.</text>
<text class="tm" x="444" y="152">Never holds a seat. Reads no files, dispatches nothing.</text>
<path class="wire" d="M218 170v26"/><path class="fill" d="M212 190l6 8 6-8"/>

<text class="band" x="8" y="222">POLICY &#183; EVERY PROPOSAL PASSES THROUGH IT</text>
<g>
  <rect class="box" x="8" y="234" width="312" height="78" rx="2"/>
  <text class="t"  x="26" y="258">Dispatch matrix</text>
  <text class="ts" x="26" y="278">the legal lane per task class and role</text>
  <text class="tm" x="26" y="298">refuses a route it does not allow</text>

  <rect class="box" x="336" y="234" width="312" height="78" rx="2"/>
  <text class="t"  x="354" y="258">Seat profiles</text>
  <text class="ts" x="354" y="278">role &#183; permissions &#183; readable skills</text>
  <text class="tm" x="354" y="298">generated into a contract the seat reads</text>

  <rect class="box" x="664" y="234" width="328" height="78" rx="2" fill="url(#h)"/>
  <text class="t"  x="682" y="258">Rules pack</text>
  <text class="ts" x="682" y="278">STANDING + R01&#8211;R22, hashed and staged</text>
  <text class="tm" x="682" y="298">a named root that cannot be read stops the run</text>
</g>
<path class="wire" d="M218 312v26"/><path class="fill" d="M212 332l6 8 6-8"/>

<text class="band" x="8" y="364">SEATS &#183; EACH ONE A LEAF</text>
<g>
  <rect class="box rub" x="8" y="376" width="312" height="72" rx="2" fill="url(#h)"/>
  <text class="t"  x="26" y="400" fill="currentColor">Ponens builds</text>
  <text class="ts" x="26" y="420">its own worktree &#183; declared paths only</text>
  <text class="tm" x="26" y="438">its tree moved: never a counted vote</text>

  <rect class="box" x="336" y="376" width="312" height="72" rx="2"/>
  <text class="t"  x="354" y="400">Scrutator verifies</text>
  <text class="ts" x="354" y="420">read-only &#183; a session of its own</text>
  <text class="tm" x="354" y="438">never the vendor that built the unit</text>

  <rect class="box" x="664" y="376" width="328" height="72" rx="2"/>
  <text class="t"  x="682" y="400">Advocatus reviews</text>
  <text class="ts" x="682" y="420">read-only &#183; a session of its own</text>
  <text class="tm" x="682" y="438">a third vendor wherever the class allows one</text>
</g>
<text class="tm" x="8" y="466">No seat may open a seat: sub-agent tools are disallowed at launch, and a seat that used one fails proof.</text>
<path class="wire" d="M218 474v26"/><path class="fill" d="M212 494l6 8 6-8"/>

<text class="band" x="8" y="526">EVIDENCE &#183; WHAT MAKES A VOTE A VOTE</text>
<g>
  <rect class="box" x="8" y="538" width="312" height="72" rx="2"/>
  <text class="t"  x="26" y="562">Proof of the seat</text>
  <text class="ts" x="26" y="582">session &#183; tokens &#183; the model that answered</text>
  <text class="tm" x="26" y="600">missing one, the vote does not count</text>

  <rect class="box" x="336" y="538" width="312" height="72" rx="2"/>
  <text class="t"  x="354" y="562">Write audit</text>
  <text class="ts" x="354" y="582">both trees, or neither</text>
  <text class="tm" x="354" y="600">a missing audit allows nothing</text>

  <rect class="box" x="664" y="538" width="328" height="72" rx="2" fill="url(#hx)"/>
  <text class="t"  x="682" y="562">Counted in code</text>
  <text class="ts" x="682" y="582">receipts bound into one transaction</text>
  <text class="tm" x="682" y="600">no model is asked what the panel decided</text>
</g>
<text class="tm" x="8" y="628">The unit&#8217;s own check gates the landing and never joins the count. An outcome word this build cannot read is a split, never a passage.</text>
</svg>
